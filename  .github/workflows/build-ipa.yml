name: Build NeoStation iOS IPA

on:
  workflow_dispatch: # Allows you to manually trigger the build via the GitHub website

jobs:
  build:
    runs-on: macos-14 # Uses GitHub's cloud Mac mini servers
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          # Matches the current Flutter requirements of neostation-frontend
          cache: true

      - name: Install Dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build Unsigned iOS App
        run: |
          # Compiles the workspace using Flutter into an unsigned archive architecture
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          # Traditional trick to turn a (.app) build bundle into an installable (.ipa) file
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r NeoStation.ipa Payload
          
            - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-iOS-Unsigned-IPA
          path: NeoStation.ipa

