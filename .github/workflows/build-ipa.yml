name: Build NeoStation iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create iOS Platform Files & Install Dependencies
        run: |
          FLUTTER_DIR=$(dirname $(find . -maxdepth 3 -name "pubspec.yaml" | head -n 1))
          echo "FLUTTER_DIR=$FLUTTER_DIR" >> $GITHUB_ENV
          cd $FLUTTER_DIR
          flutter config --no-enable-swift-package-manager
          flutter create . --platforms=ios
          flutter pub get
          if [ -d "ios" ]; then
            cd ios
            pod repo update
            pod install || true
          fi

      - name: Build Unsigned iOS App
        run: |
          cd ${{ env.FLUTTER_DIR }}
          flutter build ios --release --no-codesign --suppress-analytics

      - name: Package Payload into IPA
        run: |
          cd ${{ env.FLUTTER_DIR }}
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r NeoStation.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeoStation-iOS-Unsigned-IPA
          path: ${{ env.FLUTTER_DIR }}/NeoStation.ipa
